[project]
name = "insightpilot-ai"
version = "2.0.0"
description = "InsightPilot AI - Enterprise Automated EDA & ML Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "reportlab>=4.1.0",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
    "openai>=1.14.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
